name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - name: Bundle budget check
        run: pnpm bundle:check

      - name: Public surface check
        run: pnpm surface:check

      # Refuses a ROADMAP row marked done that is not backed by a real exported
      # symbol and a real test file, in both directions. Without this step the
      # roadmap is a claim; with it, it is a gate.
      - name: Roadmap evidence check
        run: pnpm roadmap:check

  bench:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the entire workspace — the playground depends on every
      # publishable package via dist artifacts, and Turborepo skips
      # already-built ones via its cache.
      - run: pnpm build

      # Cache the playwright browser binaries — chromium is ~150 MB.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm bench
        env:
          CI: 'true'

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/benchmarks/playwright-report
          retention-days: 7
