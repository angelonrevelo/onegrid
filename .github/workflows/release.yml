name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes an ~/.npmrc auth line that reads NODE_AUTH_TOKEN, so
          # `changeset publish` authenticates to the npm registry.
          # Without this the publish 401s even when NPM_TOKEN is set.
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Gate the publish on a green typecheck + tests. CI runs in parallel
      # on the same push, but the release job must not publish a broken
      # tarball if that race ever lands here first. (`pnpm release` builds.)
      - run: pnpm typecheck
      - run: pnpm test

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pnpm/npm read this via the ~/.npmrc that setup-node's
          # registry-url step wrote.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
