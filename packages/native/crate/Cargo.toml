[package]
name = "onegrid-native"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "oneGrid GPUI-host protocol: decode a NativeFrame JSON payload. GPUI is an optional feature so default cargo test stays a protocol crate."
publish = false

[lib]
name = "onegrid_native"
crate-type = ["rlib"]

[[bin]]
name = "onegrid-native-host"
path = "src/bin/host.rs"

[[bin]]
name = "onegrid-native-gpui"
path = "src/bin/gpui_host.rs"
required-features = ["gpui"]

[features]
default = []
# Optional GPU window. Default cargo test / cargo build does not compile gpui.
gpui = ["dep:gpui", "dep:gpui_platform"]

[dependencies]
gpui = { package = "gpui-unofficial", version = "1.18.0", optional = true }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1.18.0", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
